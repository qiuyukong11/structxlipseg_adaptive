  DEVICE: "cuda"

STRUCTXLIP:
  LAMBDA_STRUCTURE_TEXT: 0.25
  LAMBDA_RGB_STRUCTURE_CONSISTENCY: 0.02
  LAMBDA_CHUNK_ALIGN: 0.07
