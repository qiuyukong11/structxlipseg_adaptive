  CHUNK_TOP_K: 3
  CHUNK_TAU: 0.07
  CHUNK_BASE_WINDOW: 3
  CHUNK_STRIDE: 1
  CHUNK_MAX_SPANS: 64
  REMOVE_COLORS: false
